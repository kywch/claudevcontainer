model = "qwen3.8-27b"
model_provider = "vllm"

[model_providers.vllm]
name = "vLLM"
base_url = "http://127.0.0.1:8000/v1"
wire_api = "responses"

[model_providers.vllm.auth]
command = "ssh"
# b200 is the SSH hostname/alias for the remote GPU host.
args = ["-o", "BatchMode=yes", "b200", "cat", "/NHNHOME/WORKSPACE/26motir001_F/llm-serve/.api_key"]
